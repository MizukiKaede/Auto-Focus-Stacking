[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "focus-stack-assistant"
version = "0.1.0"
description = "Memory-safe metadata, grouping and focus-stack workflow helpers"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Focus Stack Assistant contributors" }]
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.8",
  "Pillow>=10.0",
  "psutil>=5.9",
  "PySide6>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
focus-stack = "focus_stack_app.app:main"

[tool.setuptools.packages.find]
include = ["focus_stack_app*"]

[tool.setuptools.package-data]
"focus_stack_app.ui" = ["icons/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
